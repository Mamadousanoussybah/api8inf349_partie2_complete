services:
  api8inf349:
    build: .
    container_name: api8inf349_app
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: api8inf349
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: api8inf349
      DB_USER: user
      DB_PASSWORD: pass
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: python -m flask run --host=0.0.0.0 --port=5000
  worker:
    build: .
    container_name: api8inf349_worker
    environment:
      FLASK_APP: api8inf349
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: api8inf349
      DB_USER: user
      DB_PASSWORD: pass
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: python -m flask worker
  postgres:
    image: postgres:12
    container_name: api8inf349_postgres
    environment:
      POSTGRES_DB: api8inf349
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:5
    container_name: api8inf349_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: